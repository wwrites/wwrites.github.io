const labels = {
Love:"Love",
Sad:"Sad Poetry",
Life:"Life Reality",
Motivation:"Motivation",
Poetry:"Urdu Poetry",
Islamic:"Islamic Words",
Stories:"Stories"
};

let category = "All";

function setCategory(c,b) {
  category = c;
  document.querySelectorAll(".filters button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  render();
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[ch]);
}

function render() {
  const searchBox = document.getElementById("search");
  const term = searchBox ? searchBox.value.toLowerCase().trim() : "";

  const list = quotes.filter(q => {
    const matchesCategory = category === "All" || q.cat === category;
    const matchesSearch = (
      q.text + " " + (q.title || "") + " " + (labels[q.cat] || "")
    ).toLowerCase().includes(term);

    return matchesCategory && matchesSearch;
  });

  document.getElementById("quoteGrid").innerHTML = list.map(q => {
    const isUr = q.lang === "ur";
    const isStory = q.cat === "Stories";
    const textClass = isStory ? "story" : (isUr ? "quote" : "english");

    return `
      <article class="card">
        <h3>${escapeHTML(q.title || labels[q.cat] || q.cat)}</h3>
        <div class="${textClass}" ${isUr ? 'dir="rtl"' : ''}>${escapeHTML(q.text)}</div>
        <div class="actions">
          <button data-action="copy" data-text="${encodeURIComponent(q.text)}">Copy</button>
          <button data-action="share" data-text="${encodeURIComponent(q.text)}">Share</button>
        </div>
      </article>
    `;
  }).join("") || "<p>No content found. Try another search.</p>";
}

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t)
      .then(() => alert("Content copied!"))
      .catch(() => alert(t));
  } else {
    alert(t);
  }
}

function shareText(t) {
  if (navigator.share) {
    navigator.share({
      title:"W.Writes",
      text:t,
      url:location.href
    }).catch(() => {});
  } else {
    copyText(t);
  }
}

// Supabase connection
const SUPABASE_URL = "https://szfzkihvlshkqhbugwpk.supabase.co";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Load only published content from Supabase
async function loadPublishedContent() {
  try {
    const { data, error } = await db
      .from("content")
      .select("category, language, title, body")
      .eq("status", "published");

    if (error) {
      console.error("Supabase content error:", error);
      return;
    }

    (data || []).forEach(item => {
      quotes.push({
        cat:item.category,
        lang:item.language,
        title:item.title || "",
        text:item.body
      });
    });

    render();

  } catch (error) {
    console.error("Website content loading error:", error);
  }
}

// Copy and Share buttons
document.getElementById("quoteGrid").addEventListener("click", function(e) {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;

  const text = decodeURIComponent(btn.dataset.text);

  if (btn.dataset.action === "copy") copyText(text);
  if (btn.dataset.action === "share") shareText(text);
});

document.getElementById("year").textContent = new Date().getFullYear();

// Show existing content immediately, then load published posts
render();
loadPublishedContent();

</script>
